name: docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'journey-engine/**'
      - '.github/workflows/docker.yml'
      - 'gradlew'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'journey-engine/**'
      - '.github/workflows/docker.yml'
      - 'gradlew'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/journey-engine:latest
